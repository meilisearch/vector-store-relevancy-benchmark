[package]
name = "benchmarks"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
# arroy = "0.6.1"
arroy = { git = "https://github.com/meilisearch/arroy", branch = "main" }
# arroy = { path = "../../arroy" }
byte-unit = "5.1.4"
bytemuck = "1.16.1"
clap = { version = "4.5.18", features = ["derive"] }
enum-iterator = "2.1.0"
fast-distances = "0.0.1"
futures-util = "0.3.30"
hannoy = { path = "../../hannoy" }
heed = "0.22.0"
itertools = "0.13.0"
memmap2 = "0.9.4"
ndarray = "0.16.1"
ordered-float = "4.2.2"
qdrant-client = "1.11.2"
rand = "0.8.5"
rayon = "1.10.0"
reqwest = { version = "0.12.5", default-features = false, features = ["http2", "rustls-tls"] }
roaring = "0.10.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slice-group-by = "0.3.1"
steppe = "0.4"
# steppe = { path = "../../steppe" } 
tempfile = "3.10.1"
tokio = { version = "1.38.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5.0"

[profile.release]
debug=true
